<html lang="pt-BR">
<head>

  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>AgendaFácil</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --gold:#D4AF37;--gold-light:#F0C040;--gold-pale:#FEF3C7;
  --dark:#1A1A1A;--dark2:#2A2A2A;--bg:#F7F4EF;--white:#FFFFFF;
  --gray:#F5F5F5;--muted:#888888;--border:#E8E4DC;
  --red:#EF4444;--green:#10B981;--blue:#3B82F6;
  --radius:16px;--radius-sm:10px;
  --shadow:0 2px 12px rgba(0,0,0,0.08);--shadow-lg:0 8px 32px rgba(0,0,0,0.12);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--dark);min-height:100vh;font-size:15px;line-height:1.5}
.app-wrap{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;overflow-x:hidden}
/* HERO */
.hero{position:relative;overflow:hidden}
.hero-cover{width:100%;height:160px;background:linear-gradient(135deg,#1a1a1a,#2a2a2a);background-size:cover;background-position:center;position:relative}
.hero-cover-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0.3),rgba(0,0,0,0.7))}
.hero-body{background:var(--dark);padding:16px 20px 20px;position:relative}
.hero-body::after{content:'';position:absolute;top:-60px;right:-40px;width:180px;height:180px;background:radial-gradient(circle,rgba(212,175,55,0.18),transparent 70%);border-radius:50%;pointer-events:none}
.hero-row{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.hero-logo{width:58px;height:58px;background:linear-gradient(135deg,var(--gold),var(--gold-light));border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;border:3px solid var(--dark);overflow:hidden;margin-top:-28px}
.hero-logo img{width:100%;height:100%;object-fit:cover}
.hero-name{font-family:'Playfair Display',serif;font-size:20px;font-weight:900;color:var(--white);line-height:1.1}
.hero-sub{font-size:12px;color:var(--gold);font-weight:500;margin-top:3px}
.hero-stats{display:flex;gap:0;margin-top:16px;position:relative;z-index:1;background:rgba(255,255,255,0.05);border-radius:12px;overflow:hidden}
.hero-stat{flex:1;text-align:center;padding:12px 8px;border-right:1px solid rgba(255,255,255,0.08)}
.hero-stat:last-child{border-right:none}
.stat-val{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--gold)}
.stat-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
/* CONTENT */
.content{padding:20px 20px 120px}
.section{margin-bottom:24px}
.section-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:10px}
/* SERVICES */
.service-list{display:flex;flex-direction:column;gap:10px}
.service-card{background:var(--white);border-radius:var(--radius);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border:2px solid transparent;cursor:pointer;transition:all .2s;box-shadow:var(--shadow)}
.service-card:hover{border-color:var(--gold);transform:translateX(2px)}
.service-card.selected{border-color:var(--gold);background:var(--gold-pale)}
.service-left{display:flex;align-items:center;gap:12px}
.service-icon{width:40px;height:40px;background:var(--gray);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.service-card.selected .service-icon{background:#fde68a}
.service-name{font-size:14px;font-weight:600}
.service-dur{font-size:11px;color:var(--muted);margin-top:2px}
.service-right{display:flex;align-items:center;gap:8px}
.service-price{font-family:'Playfair Display',serif;font-size:17px;font-weight:700}
.service-card.selected .service-price{color:#92400e}
.check{width:22px;height:22px;background:var(--gold);border-radius:50%;display:none;align-items:center;justify-content:center;font-size:11px;color:var(--dark);font-weight:700}
.service-card.selected .check{display:flex}
/* BARBERS */
.barber-list{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.barber-list::-webkit-scrollbar{display:none}
.barber-card{flex-shrink:0;text-align:center;cursor:pointer}
.barber-avatar{width:60px;height:60px;border-radius:18px;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:28px;border:2px solid transparent;transition:all .2s;margin:0 auto 6px;overflow:hidden}
.barber-card.selected .barber-avatar{border-color:var(--gold);background:var(--gold-pale)}
.barber-name{font-size:11px;font-weight:600;color:var(--muted)}
.barber-card.selected .barber-name{color:#92400e}
/* CALENDAR */
.cal-wrap{background:var(--white);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-month{font-family:'Playfair Display',serif;font-size:16px;font-weight:700}
.cal-nav{width:30px;height:30px;background:var(--gray);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;border:none;transition:background .15s}
.cal-nav:hover{background:var(--border)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-daylbl{font-size:10px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0;text-transform:uppercase}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;border-radius:8px;cursor:pointer;transition:all .15s;border:none;background:transparent}
.cal-day:hover:not(.disabled):not(.empty){background:var(--gray)}
.cal-day.today{background:var(--gray);font-weight:700}
.cal-day.selected{background:var(--dark);color:var(--white);font-weight:700}
.cal-day.disabled{color:#ccc;cursor:not-allowed}
.cal-day.blocked{color:#ccc;cursor:not-allowed;background:#fafafa;text-decoration:line-through}
.cal-day.empty{cursor:default}
/* TIMES */
.time-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.time-slot{background:var(--white);border-radius:var(--radius-sm);padding:10px 4px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;border:2px solid transparent;transition:all .15s;box-shadow:var(--shadow)}
.time-slot:hover:not(.busy){border-color:var(--gold)}
.time-slot.selected{background:var(--dark);color:var(--white);border-color:var(--dark)}
.time-slot.busy{background:var(--gray);color:#ccc;cursor:not-allowed;text-decoration:line-through;font-size:11px}
/* FORM */
.form-group{margin-bottom:12px}
.input-wrap{position:relative}
.input-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px}
.form-input{width:100%;background:var(--white);border:2px solid var(--border);border-radius:14px;padding:14px 14px 14px 44px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--dark);outline:none;transition:border-color .2s;box-shadow:var(--shadow)}
.form-input:focus{border-color:var(--gold)}
.form-input::placeholder{color:#bbb}
.form-input.error{border-color:var(--red)}
.form-input.no-icon{padding-left:14px}
.form-label{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;display:block}
/* SUMMARY */
.summary-box{background:var(--dark);border-radius:var(--radius);padding:18px}
.summary-title{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--gold);font-weight:700;margin-bottom:12px}
.summary-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:7px 0;border-bottom:1px solid #2a2a2a}
.summary-row:last-child{border-bottom:none}
.summary-lbl{color:var(--muted)}
.summary-val{font-weight:600;color:var(--white)}
.summary-val.gold{color:var(--gold);font-family:'Playfair Display',serif;font-size:16px}
/* STICKY BTN */
.sticky-btn{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;padding:16px 20px calc(24px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:50}
.btn-primary{width:100%;padding:16px;background:linear-gradient(135deg,var(--gold),var(--gold-light));border:none;border-radius:14px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;color:var(--dark);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 20px rgba(212,175,55,.35);transition:all .2s}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(212,175,55,.45)}
.btn-primary:active{transform:translateY(0)}
.btn-secondary{width:100%;padding:14px;background:var(--dark);border:none;border-radius:14px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;color:var(--white);cursor:pointer;transition:opacity .2s}
.btn-secondary:hover{opacity:.85}
.btn-danger{padding:6px 12px;background:transparent;border:1px solid var(--red);border-radius:8px;font-size:12px;font-weight:600;color:var(--red);cursor:pointer;transition:all .15s}
.btn-danger:hover{background:var(--red);color:white}
.btn-sm{padding:6px 14px;font-size:12px;font-weight:600;border-radius:8px;border:none;cursor:pointer;transition:all .15s}
.btn-confirm-ag{background:var(--green);color:white}
.btn-cancel-ag{background:transparent;border:1px solid var(--red);color:var(--red)}
/* SUCCESS */
.success-wrap{display:none;position:fixed;inset:0;background:var(--bg);z-index:100;flex-direction:column;align-items:center;justify-content:center;padding:40px 28px;text-align:center;overflow-y:auto}
.success-wrap.show{display:flex}
.success-icon{width:80px;height:80px;background:linear-gradient(135deg,var(--gold),var(--gold-light));border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:24px;box-shadow:0 8px 32px rgba(212,175,55,.3)}
.success-title{font-family:'Playfair Display',serif;font-size:28px;font-weight:900;margin-bottom:8px}
.success-sub{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:28px}
.success-card{background:var(--white);border-radius:var(--radius);padding:20px;width:100%;text-align:left;box-shadow:var(--shadow);margin-bottom:20px}
.success-row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.success-row:last-child{border-bottom:none}
.s-icon{font-size:18px}
.s-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.s-val{font-size:14px;font-weight:600;margin-top:1px}
/* PAINEL */
.painel-header{background:var(--dark);padding:calc(24px + env(safe-area-inset-top)) 20px 16px;display:flex;align-items:flex-start;justify-content:space-between}
.painel-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:900;color:var(--white)}
.painel-sub{font-size:12px;color:var(--muted);margin-top:2px}
.logout-btn{background:rgba(255,255,255,.1);border:none;border-radius:8px;padding:8px 14px;font-size:12px;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;flex-shrink:0}
.tabs{display:flex;background:var(--white);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:14px 12px;text-align:center;font-size:12px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);transition:all .15s;white-space:nowrap}
.tab.active{color:var(--dark);border-bottom-color:var(--gold)}
.painel-content{padding:20px;padding-bottom:40px}
/* AGENDA CARDS */
.ag-card{background:var(--white);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);border-left:4px solid var(--border)}
.ag-card.pendente{border-left-color:var(--gold)}
.ag-card.confirmado{border-left-color:var(--green)}
.ag-card.cancelado{border-left-color:#ccc;opacity:.6}
.ag-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.ag-nome{font-size:15px;font-weight:700}
.ag-status{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:3px 8px;border-radius:6px}
.ag-status.pendente{background:#fef3c7;color:#92400e}
.ag-status.confirmado{background:#d1fae5;color:#065f46}
.ag-status.cancelado{background:var(--gray);color:var(--muted)}
.ag-info{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px;margin-bottom:12px}
.ag-info span{display:flex;align-items:center;gap:6px}
.ag-actions{display:flex;gap:8px;flex-wrap:wrap}
/* CONFIG */
.cfg-card{background:var(--white);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center}
.cfg-info{flex:1}
.cfg-name{font-size:14px;font-weight:600}
.cfg-detail{font-size:12px;color:var(--muted);margin-top:2px}
.cfg-actions{display:flex;gap:8px}
/* ADD FORM */
.add-form{background:var(--white);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.add-form-title{font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* AUTH */
.auth-wrap{min-height:100vh;display:flex;flex-direction:column}
.auth-hero{background:var(--dark);padding:calc(36px + env(safe-area-inset-top)) 28px 40px;text-align:center}
.auth-logo{font-size:40px;margin-bottom:12px}
.auth-brand{font-family:'Playfair Display',serif;font-size:28px;font-weight:900;color:var(--white)}
.auth-tagline{font-size:13px;color:var(--muted);margin-top:6px}
.auth-body{flex:1;padding:28px 24px 40px}
.auth-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;margin-bottom:6px}
.auth-sub{font-size:13px;color:var(--muted);margin-bottom:24px}
.auth-switch{text-align:center;margin-top:20px;font-size:13px;color:var(--muted)}
.auth-switch a{color:var(--dark);font-weight:700;cursor:pointer;text-decoration:underline}
.link-preview{background:var(--gray);border-radius:10px;padding:10px 14px;font-size:12px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:6px}
.link-preview strong{color:var(--dark)}
/* HORÁRIO CONFIG */
.day-row{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--white);border-radius:12px;margin-bottom:8px;box-shadow:var(--shadow)}
.day-header-row{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap}
.day-toggle{position:relative;width:40px;height:22px;flex-shrink:0}
.day-toggle input{opacity:0;width:0;height:0}
.day-slider{position:absolute;inset:0;background:#ccc;border-radius:22px;cursor:pointer;transition:.3s}
.day-slider:before{content:'';position:absolute;width:16px;height:16px;left:3px;bottom:3px;background:white;border-radius:50%;transition:.3s}
.day-toggle input:checked+.day-slider{background:var(--gold)}
.day-toggle input:checked+.day-slider:before{transform:translateX(18px)}
.day-toggle-sm{width:34px;height:19px}
.day-toggle-sm .day-slider:before{width:13px;height:13px}
.day-toggle-sm input:checked+.day-slider:before{transform:translateX(15px)}
.day-name{font-size:13px;font-weight:600;width:36px;flex-shrink:0}
.day-times{display:flex;gap:6px;flex:1 1 190px;min-width:190px;align-items:center}
.time-input{width:82px;max-width:38vw;padding:6px 4px;border:1px solid var(--border);border-radius:8px;font-size:12px;font-family:'DM Sans',sans-serif;color:var(--dark);background:var(--bg)}
.time-sep{font-size:11px;color:var(--muted)}
/* UPLOAD FOTO */
.photo-upload{display:flex;flex-direction:column;gap:12px}
.photo-box{width:100%;height:120px;background:var(--gray);border:2px dashed var(--border);border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden;transition:border-color .2s}
.photo-box:hover{border-color:var(--gold)}
.photo-box img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.photo-box-label{font-size:12px;color:var(--muted);text-align:center;z-index:1}
.photo-box input{position:absolute;inset:0;opacity:0;cursor:pointer}
.logo-box{width:80px;height:80px;background:var(--gray);border:2px dashed var(--border);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden;flex-shrink:0;transition:border-color .2s}
.logo-box:hover{border-color:var(--gold)}
.logo-box img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.logo-box input{position:absolute;inset:0;opacity:0;cursor:pointer}
/* EMPTY */
.empty-state{text-align:center;padding:48px 20px;color:var(--muted)}
.empty-icon{font-size:40px;margin-bottom:12px}
.empty-text{font-size:14px}
/* TOAST */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--dark);color:var(--white);padding:12px 20px;border-radius:12px;font-size:13px;font-weight:500;z-index:999;opacity:0;transition:all .3s;white-space:nowrap;box-shadow:var(--shadow-lg)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* DIVIDER */
.section-divider{height:1px;background:var(--border);margin:20px 0}
@media(min-width:430px){.app-wrap{box-shadow:0 0 60px rgba(0,0,0,.15)}}
@media(max-width:359px){
  .content{padding:16px 16px 120px}
  .hero-body{padding:14px 16px 18px}
  .painel-content{padding:16px}
  .service-card,.cfg-card,.ag-card{padding:12px}
  .add-form{padding:14px}
  .time-grid{grid-template-columns:repeat(3,1fr);gap:6px}
  .barber-avatar{width:52px;height:52px;font-size:24px}
  .hero-name{font-size:18px}
  .success-title{font-size:24px}
  .hero-stat{padding:10px 4px}
  .stat-val{font-size:16px}
}
@media(max-width:340px){
  .time-input{width:74px}
}

  // ============================================
  // AUTH — COMERCIANTE (barbeiro/dono)
  // ============================================
  async registerDono(nome,email,senha,slug,nomeBarbearia){
    const {data:existing}=await sb.from('negocios').select('id').eq('slug',slug).maybeSingle();
    if(existing)return{error:'Link já em uso, escolha outro'};
    const {data:signData,error:signErr}=await sb.auth.signUp({email,password:senha,options:{data:{nome,role:'dono'}}});
    if(signErr)return{error:signErr.message.includes('registered')?'E-mail já cadastrado':signErr.message};
    if(!signData.session){return{precisaConfirmarEmail:true}}
    return await this.criarInfraestruturaNegocio(signData.user.id,nome,slug,nomeBarbearia);
  },

  // Cria negócio + serviço padrão + profissional + horários + trial de 14 dias.
  // Reutilizado tanto no cadastro normal quanto no primeiro login via Google.
  async criarInfraestruturaNegocio(userId,nome,slug,nomeBarbearia){
    const {data:negocioRow,error:negErr}=await sb.from('negocios').insert({dono_id:userId,nome:nomeBarbearia,slug,telefone:'',logo:'',capa:''}).select().single();
    if(negErr)return{error:negErr.message.includes('duplicate')?'Link já em uso, escolha outro':'Erro ao criar barbearia: '+negErr.message};
    await sb.from('servicos').insert({negocio_id:negocioRow.id,nome:'Corte Masculino',duracao:30,preco:45});
    const {data:profRow}=await sb.from('profissionais').insert({negocio_id:negocioRow.id,nome,foto:''}).select().single();
    if(profRow)await sb.from('horarios').insert({negocio_id:negocioRow.id,profissional_id:profRow.id,dados:HORARIO_PADRAO});
    const trialEnd=new Date();trialEnd.setDate(trialEnd.getDate()+14);
    await sb.from('assinaturas').insert({negocio_id:negocioRow.id,status:'trial',plano:null,proximo_vencimento:trialEnd.toISOString().split('T')[0]});
    return{negocio:mapNegocio(negocioRow)};
  },

  async loginDono(email,senha){
    const {data,error}=await sb.auth.signInWithPassword({email,password:senha});
    if(error)return{error:error.message.includes('Email not confirmed')?'Confirme seu e-mail antes de entrar — verifique sua caixa de entrada.':'E-mail ou senha incorretos.'};
    return{user:data.user};
  },

  async signInWithGoogle(intent){
    // intent: 'dono' ou 'cliente' — lembra qual fluxo retomar depois do Google redirecionar de volta
    const redirectTo=`${location.origin}${location.pathname}?oauth_intent=${intent}`;
    const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo}});
    if(error)return{error:error.message};
    return{ok:true};
  },

  async getDonoAtual(){
    const {data:{user}}=await sb.auth.getUser();
    if(!user)return null;
    const {data:negocioRow}=await sb.from('negocios').select('*').eq('dono_id',user.id).maybeSingle();
    if(!negocioRow)return null;
    return{userId:user.id,nome:(user.user_metadata&&user.user_metadata.nome)||'',negocio:mapNegocio(negocioRow)};
  },

  // ============================================
  // ASSINATURA (mensalidade)
  // ============================================
  async getAssinatura(negocioId){
    const {data}=await sb.from('assinaturas').select('*').eq('negocio_id',negocioId).maybeSingle();
    if(!data)return null;
    return{status:data.status,plano:data.plano,proximoVencimento:data.proximo_vencimento,temAssinaturaStripe:!!data.stripe_subscription_id};
  },

  async iniciarCheckout(negocioId,plano){
    try{
      const resp=await fetch('/api/create-checkout-session',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({negocioId,plano})
      });
      const data=await resp.json();
      if(!resp.ok||!data.url)return{error:data.error||'Erro ao iniciar pagamento'};
      return{url:data.url};
    }catch(e){return{error:'Erro de conexão: '+e.message}}
  },

  async cancelarAssinatura(negocioId,reativar){
    try{
      const {data:{session}}=await sb.auth.getSession();
      if(!session)return{error:'Sessão expirada, faça login novamente.'};
      const resp=await fetch('/api/cancel-subscription',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`},
        body:JSON.stringify({negocioId,reativar:!!reativar})
      });
      const data=await resp.json();
      if(!resp.ok)return{error:data.error||'Erro ao processar solicitação'};
      return{ok:true};
    }catch(e){return{error:'Erro de conexão: '+e.message}}
  },

  async trocarPlano(negocioId,novoPlano){
    try{
      const {data:{session}}=await sb.auth.getSession();
      if(!session)return{error:'Sessão expirada, faça login novamente.'};
      const resp=await fetch('/api/change-plan',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`},
        body:JSON.stringify({negocioId,novoPlano})
      });
      const data=await resp.json();
      if(!resp.ok)return{error:data.error||'Erro ao processar solicitação'};
      return data;
    }catch(e){return{error:'Erro de conexão: '+e.message}}
  },


  // AUTH — CLIENTE (conta global)
  // ============================================
  async registerCliente(nome,email,tel,senha){
    const {data:signData,error:signErr}=await sb.auth.signUp({email,password:senha,options:{data:{nome,role:'cliente'}}});
    if(signErr)return{error:signErr.message.includes('registered')?'E-mail já cadastrado':signErr.message};
    if(!signData.session){return{precisaConfirmarEmail:true}}
    return await this.criarPerfilCliente(signData.user.id,nome,email,tel);
  },

  async criarPerfilCliente(userId,nome,email,tel){
    const {data:clienteRow,error:cErr}=await sb.from('clientes').insert({id:userId,nome,email,telefone:tel}).select().single();
    if(cErr)return{error:'Erro ao criar perfil: '+cErr.message};
    return{cliente:mapCliente(clienteRow)};
  },

  async loginCliente(email,senha){
    const {data,error}=await sb.auth.signInWithPassword({email,password:senha});
    if(error)return{error:error.message.includes('Email not confirmed')?'Confirme seu e-mail antes de entrar — verifique sua caixa de entrada.':'E-mail ou senha incorretos.'};
    const {data:clienteRow}=await sb.from('clientes').select('*').eq('id',data.user.id).maybeSingle();
    if(!clienteRow){await sb.auth.signOut();return{error:'Esta conta não é de cliente.'}}
    return{cliente:mapCliente(clienteRow)};
  },

  async getClienteAtual(){
    const {data:{user}}=await sb.auth.getUser();
    if(!user)return null;
    const {data:clienteRow}=await sb.from('clientes').select('*').eq('id',user.id).maybeSingle();
    if(!clienteRow)return null;
    return mapCliente(clienteRow);
  },

  async logout(){ await sb.auth.signOut(); },

  // ============================================
  // NEGÓCIOS
  // ============================================
  async getNegocio(slug){
    const {data}=await sb.from('negocios').select('*').eq('slug',slug).maybeSingle();
    return mapNegocio(data);
  },
  async updateNegocio(id,fields){
    const dbFields={};
    if('nome' in fields)dbFields.nome=fields.nome;
    if('logo' in fields)dbFields.logo=fields.logo;
    if('capa' in fields)dbFields.capa=fields.capa;
    if('telefone' in fields)dbFields.telefone=fields.telefone;
    await sb.from('negocios').update(dbFields).eq('id',id);
  },

  // ============================================
  // SERVIÇOS
  // ============================================
  async getServicos(negocioId){
    const {data}=await sb.from('servicos').select('*').eq('negocio_id',negocioId).order('created_at');
    return (data||[]).map(mapServico);
  },
  async addServico(negocioId,nome,duracao,preco){
    await sb.from('servicos').insert({negocio_id:negocioId,nome,duracao,preco});
  },
  async deleteServico(id){ await sb.from('servicos').delete().eq('id',id); },

  // ============================================
  // PROFISSIONAIS
  // ============================================
  async getProfissionais(negocioId){
    const {data}=await sb.from('profissionais').select('*').eq('negocio_id',negocioId).order('created_at');
    return (data||[]).map(mapProf);
  },
  async addProfissional(negocioId,nome,foto){
    const {data}=await sb.from('profissionais').insert({negocio_id:negocioId,nome,foto:foto||''}).select().single();
    if(data)await sb.from('horarios').insert({negocio_id:negocioId,profissional_id:data.id,dados:HORARIO_PADRAO});
    return mapProf(data);
  },
  async updateProfissionalFoto(id,foto){ await sb.from('profissionais').update({foto}).eq('id',id); },
  async deleteProfissional(id){ await sb.from('profissionais').delete().eq('id',id); },

  // ============================================
  // HORÁRIOS
  // ============================================
  async getHorariosTodos(negocioId){
    const {data}=await sb.from('horarios').select('*').eq('negocio_id',negocioId);
    const map={};
    (data||[]).forEach(row=>{ map[row.profissional_id]=row.dados; });
    return map;
  },
  async saveHorarios(negocioId,profId,dados){
    await sb.from('horarios').upsert({negocio_id:negocioId,profissional_id:profId,dados,updated_at:new Date().toISOString()},{onConflict:'negocio_id,profissional_id'});
  },
  async getHorariosOcupados(negocioId,profId,data){
    const {data:rows}=await sb.rpc('horarios_ocupados',{p_negocio_id:negocioId,p_profissional_id:profId,p_data:data});
    return (rows||[]).map(r=>{
      const [hh,mm]=(r.hora||'00:00:00').substring(0,5).split(':').map(Number);
      const ini=hh*60+mm;
      return {ini,fim:ini+(r.duracao||30)};
    });
  },

  // ============================================
  // AGENDAMENTOS
  // ============================================
  async getAgendamentos(negocioId){
    const {data}=await sb.from('agendamentos').select('*').eq('negocio_id',negocioId);
    return (data||[]).map(mapAg);
  },
  async getAgendamentosByCliente(clienteId){
    const {data}=await sb.from('agendamentos').select('*').eq('cliente_id',clienteId);
    return (data||[]).map(mapAg);
  },
  async insertAgendamento(ag){
    const {data,error}=await sb.from('agendamentos').insert({
      negocio_id:ag.negocioId,cliente_id:ag.clienteId,cliente_nome:ag.clienteNome,
      cliente_tel:ag.clienteTel,cliente_email:ag.clienteEmail,servico_id:ag.servicoId,
      profissional_id:ag.profissionalId,data:ag.data,hora:ag.hora,status:'pendente',codigo:ag.codigo
    }).select().single();
    if(error)return{error:error.message};
    return{ag:mapAg(data)};
  },
  async updateStatus(id,status){ await sb.from('agendamentos').update({status}).eq('id',id); },

  async buscarPorCodigo(codigo){
    const {data,error}=await sb.rpc('buscar_agendamento_por_codigo',{p_codigo:codigo});
    if(error||!data||!data.length)return null;
    const r=data[0];
    return {id:r.id,negocioId:r.negocio_id,profissionalId:r.profissional_id,servicoId:r.servico_id,data:r.data,hora:(r.hora||'').substring(0,5),status:r.status,clienteNome:r.cliente_nome};
  },
  async cancelarPorCodigo(codigo){ await sb.rpc('cancelar_por_codigo',{p_codigo:codigo}); },

  // ============================================
  // BLOQUEIOS
  // ============================================
  async getBloqueios(negocioId){
    const {data}=await sb.from('bloqueios').select('*').eq('negocio_id',negocioId);
    return (data||[]).map(mapBloqueio);
  },
  async buscarClientePorEmail(email){
    const {data,error}=await sb.rpc('buscar_cliente_por_email',{p_email:email});
    if(error||!data||!data.length)return null;
    const r=data[0];
    return{id:r.id,nome:r.nome,email:r.email,tel:r.telefone||''};
  },
  async bloquearCliente(negocioId,clienteId,nome,tel,email){
    const {error}=await sb.from('bloqueios').insert({negocio_id:negocioId,cliente_id:clienteId,nome,tel:tel||'',email:email||''});
    return{error:error?error.message:null};
  },
  async desbloquearCliente(id){ await sb.from('bloqueios').delete().eq('id',id); },

  // ============================================
  // UTIL
  // ============================================
  uid(){ return '_'+Math.random().toString(36).substr(2,9); },
};
</script>
<script>

// Protege contra XSS: converte caracteres perigosos de HTML em entidades seguras
// antes de inserir qualquer dado digitado por usuários na tela.
function esc(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// ============================================
// APP
// ============================================
// Limite de tamanho para fotos (evita sobrecarregar o banco com arquivos gigantes)
const MAX_FOTO_MB = 2;
function arquivoValido(file, showToastFn) {
  if (!file) return false;
  if (!file.type || !file.type.startsWith('image/')) {
    showToastFn('⚠️ Envie apenas arquivos de imagem');
    return false;
  }
  if (file.size > MAX_FOTO_MB * 1024 * 1024) {
    showToastFn(`⚠️ Imagem muito grande — máximo ${MAX_FOTO_MB}MB`);
    return false;
  }
  return true;
}

const App = {
  currentNegocio:null,currentSlug:null,
  selectedServico:null,selectedProfissional:null,selectedData:null,selectedHora:null,
  calMonth:new Date().getMonth(),calYear:new Date().getFullYear(),
  cache:{negocioId:null,negocio:null,servicos:[],profissionais:[],agendamentos:[],horarios:{},bloqueios:[]},

  async init(){
    // Retorno do login com Google: verifica se precisa completar o cadastro
    // (Google só nos dá nome e e-mail — telefone ou nome da barbearia
    // precisam ser preenchidos na primeira vez)
    const oauthIntent=new URLSearchParams(location.search).get('oauth_intent');
    if(oauthIntent){
      history.replaceState(null,'',location.pathname+location.hash);
      const tratado=await this.tratarRetornoGoogle(oauthIntent);
      if(tratado)return;
    }

    const hash=location.hash.replace('#','')||'';
    const parts=hash.split('/');
    if(parts[0]==='agendar'&&parts[1])await this.showAgendarPage(parts[1]);
    else if(parts[0]==='cancelar')await this.showCancelarPage(parts[1]||'');
    else if(parts[0]==='meus-agendamentos')await this.showMeusAgendamentos();
    else if(parts[0]==='painel')await this.checkAuthAndShowPainel();
    else if(parts[0]==='login')this.showLogin();
    else if(parts[0]==='register')this.showRegister();
    else if(parts[0]==='cliente-login')this.showClienteLoginGeral();
    else if(parts[0]==='cliente-register')this.showClienteRegisterGeral();
    else await this.showHome();
  },

  async tratarRetornoGoogle(intent){
    const {data:{user}}=await sb.auth.getUser();
    if(!user)return false;

    if(intent==='dono'){
      const dono=await DB.getDonoAtual();
      if(dono){await this.showPainel(dono);return true}
      this.showCompletarCadastroDono(user);
      return true;
    }else{
      const cliente=await DB.getClienteAtual();
      if(cliente){this.navigate('meus-agendamentos');return true}
      this.showCompletarCadastroCliente(user);
      return true;
    }
  },

  navigate(h){location.hash=h},

  // HOME — escolha entre Cliente ou Comerciante
  async showHome(){
    const cliente=await DB.getClienteAtual();
    document.getElementById('app').innerHTML=`
    <div class="app-wrap">
      <div style="background:var(--dark);padding:60px 28px 48px;text-align:center;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;">
        <div style="font-size:52px;margin-bottom:16px;">✂️</div>
        <div style="font-family:'Playfair Display',serif;font-size:32px;font-weight:900;color:white;margin-bottom:8px;">AgendaFácil</div>
        <div style="font-size:14px;color:var(--muted);margin-bottom:40px;line-height:1.6;">Agendamento online para<br>barbearias e salões</div>

        <div style="width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px;">

          <button onclick="App.navigate('cliente-login')" style="width:100%;padding:22px 20px;background:linear-gradient(135deg,var(--gold),var(--gold-light));border:none;border-radius:18px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:14px;box-shadow:0 6px 24px rgba(212,175,55,.3);">
            <div style="font-size:28px;">👤</div>
            <div>
              <div style="font-family:'Syne','Playfair Display',serif;font-size:16px;font-weight:800;color:var(--dark);">Sou Cliente</div>
              <div style="font-size:12px;color:rgba(26,26,26,0.7);margin-top:2px;">Agendar horário em uma barbearia</div>
            </div>
          </button>

          <button onclick="App.navigate('login')" style="width:100%;padding:22px 20px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);border-radius:18px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:14px;">
            <div style="font-size:28px;">💈</div>
            <div>
              <div style="font-family:'Syne','Playfair Display',serif;font-size:16px;font-weight:800;color:white;">Sou Comerciante</div>
              <div style="font-size:12px;color:var(--muted);margin-top:2px;">Gerenciar minha barbearia</div>
            </div>
          </button>

        </div>

        ${cliente?`
        <button onclick="App.navigate('meus-agendamentos')" style="margin-top:24px;background:none;border:none;color:var(--gold);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;text-decoration:underline;">
          Continuar como ${esc(cliente.nome)} →
        </button>`:''}
      </div>
    </div>`;
  },

  // ============================================
  // AUTH — COMERCIANTE
  // ============================================
  showLogin(){
    document.getElementById('app').innerHTML=`
    <div class="app-wrap"><div class="auth-wrap">
      <div class="auth-hero" style="position:relative;">
        <div onclick="App.navigate('')" style="position:absolute;top:calc(20px + env(safe-area-inset-top));left:20px;color:white;font-size:20px;cursor:pointer;">←</div>
        <div class="auth-logo">✂️</div><div class="auth-brand">AgendaFácil</div><div class="auth-tagline">Painel do profissional</div></div>
      <div class="auth-body">
        <div class="auth-title">Bem-vindo de volta</div>
        <div class="auth-sub">Entre para gerenciar seus agendamentos</div>
        <div id="login-error" style="color:var(--red);font-size:13px;margin-bottom:12px;display:none;"></div>
        <div class="form-group"><div class="input-wrap"><span class="input-icon">✉️</span><input class="form-input" type="email" id="login-email" placeholder="Seu e-mail"></div></div>
        <div class="form-group"><div class="input-wrap"><span class="input-icon">🔒</span><input class="form-input" type="password" id="login-senha" placeholder="Senha"></div></div>
        <button class="btn-primary" onclick="App.doLogin()" style="margin-top:8px;">Entrar</button>
        ${this.botaoGoogleHtml('dono')}
        <div class="auth-switch">Não tem conta? <a onclick="App.navigate('register')">Cadastrar grátis</a></div>
      </div>
    </div></div>`;
  },

  botaoGoogleHtml(intent){
    return`
    <div style="text-align:center;margin:16px 0;font-size:12px;color:var(--muted);">— ou —</div>
    <button onclick="App.entrarComGoogle('${intent}')" style="width:100%;padding:13px;background:white;border:2px solid var(--border);border-radius:14px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--dark);">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.66 9c0-.59.1-1.17.29-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l2.99-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.97l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
      Continuar com Google
    </button>`;
  },

  async entrarComGoogle(intent){
    const result=await DB.signInWithGoogle(intent);
    if(result.error)this.showToast('⚠️ '+result.error);
  },

  async doLogin(){
    const email=document.getElementById('login-email').value.trim();
    const senha=document.getElementById('login-senha').value;
    const el=document.getElementById('login-error');
    if(!email||!senha){el.textContent='Preencha e-mail e senha.';el.style.display='block';return}
    const result=await DB.loginDono(email,senha);
    if(result.error){el.textContent=result.error;el.style.display='block';return}
    const dono=await DB.getDonoAtual();
    if(!dono){el.textContent='Esta conta não é de um comerciante.';el.style.display='block';await DB.logout();return}
    await this.showPainel(dono);
  },

  showRegister(){
    document.getElementById('app').innerHTML=`
    <div class="app-wrap"><div class="auth-wrap">
      <div class="auth-hero" style="position:relative;">
        <div onclick="App.navigate('login')" style="position:absolute;top:calc(20px + env(safe-area-inset-top));left:20px;color:white;font-size:20px;cursor:pointer;">←</div>
        <div class="auth-logo">✂️</div><div class="auth-brand">AgendaFácil</div><div class="auth-tagline">Cadastre sua barbearia grátis</div></div>
      <div class="auth-body">
        <div class="auth-title">Criar conta</div>
        <div class="auth-sub">Em menos de 2 minutos você terá seu link de agendamento</div>
        <div id="reg-error" style="color:var(--red);font-size:13px;margin-bottom:12px;display:none;"></div>
        <div class="form-group"><div class="input-wrap"><span class="input-icon">👤</span><input class="form-input" type="text" id="reg-nome" placeholder="Seu nome"></div></div>

  updateSlugPreview(){
    const v=document.getElementById('reg-slug').value.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'');
    document.getElementById('reg-slug').value=v;
    document.getElementById('slug-preview').textContent=v||'minha-barbearia';

  async doRegister(){
    const nome=document.getElementById('reg-nome').value.trim();
    const barbearia=document.getElementById('reg-barbearia').value.trim();
    const slug=document.getElementById('reg-slug').value.trim();
    const email=document.getElementById('reg-email').value.trim();
    const senha=document.getElementById('reg-senha').value;
    const errEl=document.getElementById('reg-error');
    if(!nome||!barbearia||!slug||!email||!senha){errEl.textContent='Preencha todos os campos.';errEl.style.display='block';return}
    if(senha.length<8){errEl.textContent='Senha deve ter pelo menos 8 caracteres.';errEl.style.display='block';return}
    errEl.style.display='none';
    this.showToast('⏳ Criando sua conta...');
    const result=await DB.registerDono(nome,email,senha,slug,barbearia);
    if(result.precisaConfirmarEmail){this.showConfirmeEmail(email);return}
    if(result.error){errEl.textContent=result.error;errEl.style.display='block';return}
    const dono=await DB.getDonoAtual();
    await this.showPainel(dono);
  },

    const dono=await DB.getDonoAtual();
    if(!dono){this.navigate('login');return}
    await this.showPainel(dono);
  },

  async logoutDono(){ await DB.logout(); this.navigate(''); location.reload(); },

  async loadCache(negocioId,negocioObj){
    const [servicos,profissionais,agendamentos,horarios,bloqueios]=await Promise.all([
      DB.getServicos(negocioId),
      DB.getProfissionais(negocioId),
      DB.getAgendamentos(negocioId),
      DB.getHorariosTodos(negocioId),
      DB.getBloqueios(negocioId),
    ]);
    this.cache={negocioId,negocio:negocioObj,servicos,profissionais,agendamentos,horarios,bloqueios};
  },

  async switchTab(tab,el){
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    el.classList.add('active');
    const c=document.getElementById('painel-content');
    c.innerHTML='<div class="loading">Carregando...</div>';
    // recarrega cache (dados podem ter mudado)
    await this.loadCache(this.cache.negocioId,this.cache.negocio);
    if(tab==='agenda')c.innerHTML=this.renderAgenda();
    else if(tab==='historico')c.innerHTML=this.renderHistorico();
    else if(tab==='servicos')c.innerHTML=this.renderServicos();
    else if(tab==='profissionais')c.innerHTML=this.renderProfissionais();
    else if(tab==='horarios')c.innerHTML=this.renderHorarios();
    else if(tab==='bloqueados')c.innerHTML=this.renderBloqueados();
    else if(tab==='assinatura')c.innerHTML=await this.renderAssinatura();
    else if(tab==='config')c.innerHTML=this.renderConfig();
  },

  async refreshPainelContent(){
    await this.loadCache(this.cache.negocioId,this.cache.negocio);
  },

  // ---- AGENDA ----
  renderAgenda(){
    const negocioId=this.cache.negocioId;
    const modo=this.agendaViewMode||'lista';
    const toggle=`
      <div style="display:flex;gap:8px;margin-bottom:16px;">
        <button onclick="App.setAgendaView('lista')" style="flex:1;padding:10px;border-radius:10px;border:none;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer;background:${modo==='lista'?'var(--dark)':'var(--white)'};color:${modo==='lista'?'white':'var(--muted)'};box-shadow:var(--shadow);">📋 Lista</button>
        <button onclick="App.setAgendaView('dia')" style="flex:1;padding:10px;border-radius:10px;border:none;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer;background:${modo==='dia'?'var(--dark)':'var(--white)'};color:${modo==='dia'?'white':'var(--muted)'};box-shadow:var(--shadow);">🕐 Visão do Dia</button>
      </div>`;
    if(modo==='dia')return toggle+this.renderAgendaDia();

    const today=new Date().toISOString().split('T')[0];
    const ags=this.cache.agendamentos.filter(a=>a.data>=today).sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora));
    if(!ags.length)return toggle+`<div class="empty-state"><div class="empty-icon">📅</div><div class="empty-text">Nenhum agendamento ainda.<br>Compartilhe seu link com os clientes!</div></div>`;
    return toggle+ags.map(ag=>{
      const s=this.cache.servicos.find(x=>x.id===ag.servicoId);
      const p=this.cache.profissionais.find(x=>x.id===ag.profissionalId);
      const df=new Date(ag.data+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'short'});
      const actions=ag.status==='pendente'?`
        <button class="btn-sm btn-confirm-ag" onclick="App.updateAg('${ag.id}','confirmado')">✓ Confirmar</button>
        <button class="btn-sm btn-cancel-ag" onclick="App.updateAg('${ag.id}','cancelado')">✕ Cancelar</button>
        <button class="btn-sm" style="background:transparent;border:1px solid #aaa;color:#888;margin-top:4px;" onclick="App.bloquearClienteDeAg('${ag.id}')">🚫 Bloquear</button>`
      :ag.status==='confirmado'?`
        <button class="btn-sm btn-cancel-ag" onclick="App.updateAg('${ag.id}','cancelado')">✕ Cancelar</button>
        <button class="btn-sm" style="background:transparent;border:1px solid #aaa;color:#888;" onclick="App.bloquearClienteDeAg('${ag.id}')">🚫 Bloquear</button>`
      :'';
      return`<div class="ag-card ${ag.status}">
        <div class="ag-head"><div class="ag-nome">${esc(ag.clienteNome)}</div><div class="ag-status ${ag.status}">${ag.status}</div></div>
        <div class="ag-info">
          <span>📱 ${esc(ag.clienteTel)||'-'}</span>
          ${ag.clienteEmail?`<span>✉️ ${esc(ag.clienteEmail)}</span>`:''}
          <span>✂️ ${s?s.nome:'-'} · R$${s?s.preco:'-'}</span>
          <span>👤 ${p?p.nome:'-'}</span>
          <span>📅 ${df} às ${ag.hora}</span>
        </div>
        <div class="ag-actions">${actions}</div>
      </div>`;
    }).join('');
  },

  setAgendaView(modo){
    this.agendaViewMode=modo;
    if(modo==='dia'&&!this.agendaDiaData)this.agendaDiaData=new Date().toISOString().split('T')[0];
    document.getElementById('painel-content').innerHTML=this.renderAgenda();
  },

  // ---- VISÃO DO DIA ----
  renderAgendaDia(){
    const profs=this.cache.profissionais;
    if(!profs.length)return`<div class="empty-state"><div class="empty-icon">👤</div><div class="empty-text">Cadastre um profissional primeiro</div></div>`;
    if(!this.agendaDiaData)this.agendaDiaData=new Date().toISOString().split('T')[0];
    if(!this.agendaDiaProf||!profs.some(p=>p.id===this.agendaDiaProf))this.agendaDiaProf=profs[0].id;

    const data=this.agendaDiaData;
    const profId=this.agendaDiaProf;
    const d=new Date(data+'T12:00:00');
    const dataFmt=d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
    const dow=d.getDay();

    const h=this.cache.horarios[profId]||{};
    const dayConfig=h[dow];
    const bloqueados=h.bloqueados||[];
    const dataBloqueada=bloqueados.includes(data);

    const header=`
      <div style="background:var(--white);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:14px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
          <button class="cal-nav" onclick="App.mudarDiaAgenda(-1)">‹</button>
          <div style="text-align:center;">
            <div style="font-family:'Playfair Display',serif;font-size:15px;font-weight:700;text-transform:capitalize;">${dataFmt}</div>
          </div>
          <button class="cal-nav" onclick="App.mudarDiaAgenda(1)">›</button>
        </div>
        <select onchange="App.mudarProfAgenda(this.value)" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:13px;background:var(--bg);color:var(--dark);">
          ${profs.map(p=>`<option value="${p.id}" ${p.id===profId?'selected':''}>👤 ${esc(p.nome)}</option>`).join('')}
        </select>
      </div>`;

    if(!dayConfig||!dayConfig.on||dataBloqueada){
      return header+`<div class="empty-state"><div class="empty-icon">🚪</div><div class="empty-text">${dataBloqueada?'Data bloqueada — sem expediente':'Fechado neste dia da semana'}</div></div>`;
    }

    const [hI,mI]=dayConfig.inicio.split(':').map(Number);
    const [hF,mF]=dayConfig.fim.split(':').map(Number);
    let cur=hI*60+mI;
    const end=hF*60+mF;
    const almoco=dayConfig.almoco;
    let almocoIni=null,almocoFim=null;
    if(almoco&&almoco.on){
      const [aI,amI]=almoco.inicio.split(':').map(Number);
      const [aF,amF]=almoco.fim.split(':').map(Number);
      almocoIni=aI*60+amI;almocoFim=aF*60+amF;
    }

    const servicos=this.cache.servicos;
    const ags=this.cache.agendamentos.filter(a=>a.data===data&&a.profissionalId===profId&&a.status!=='cancelado');
    const ocupados=ags.map(a=>{
      const s=servicos.find(x=>x.id===a.servicoId);
      const dur=s?s.duracao:30;
      const [hh,mm]=a.hora.split(':').map(Number);
      const ini=hh*60+mm;
      return{ini,fim:ini+dur,ag:a,servico:s};
    });

    const linhas=[];
    let cursor=cur;
    while(cursor<end){
      const slotFim=cursor+30;
      const horaLabel=`${String(Math.floor(cursor/60)).padStart(2,'0')}:${String(cursor%60).padStart(2,'0')}`;
      const noAlmoco=almocoIni!==null&&cursor<almocoFim&&slotFim>almocoIni;
      const ocupado=ocupados.find(o=>cursor<o.fim&&slotFim>o.ini);
      if(noAlmoco){
        linhas.push(`<div style="display:flex;align-items:center;gap:12px;padding:10px 14px;background:#f3f4f6;border-radius:10px;margin-bottom:6px;">
          <div style="font-size:12px;font-weight:700;color:var(--muted);width:44px;flex-shrink:0;">${horaLabel}</div>
          <div style="font-size:12px;color:var(--muted);">🍽️ Horário de almoço</div>
        </div>`);
      }else if(ocupado){
        const statusColor=ocupado.ag.status==='confirmado'?'var(--green)':'var(--gold)';
        if(cursor<=ocupado.ini&&cursor+30>ocupado.ini){
          linhas.push(`<div style="display:flex;align-items:center;gap:12px;padding:10px 14px;background:white;border-radius:10px;margin-bottom:6px;border-left:4px solid ${statusColor};box-shadow:var(--shadow);">
            <div style="font-size:12px;font-weight:700;color:var(--dark);width:44px;flex-shrink:0;">${ocupado.ag.hora}</div>
            <div style="flex:1;min-width:0;">
              <div style="font-size:13px;font-weight:700;">${ocupado.ag.clienteNome}</div>
              <div style="font-size:11px;color:var(--muted);">✂️ ${ocupado.servico?ocupado.servico.nome:'-'} · ${ocupado.servico?ocupado.servico.duracao:30}min · ${ocupado.ag.status}</div>
            </div>
          </div>`);
        }else{
          // continuação do mesmo atendimento — mostra faixa mais fina ao invés de sumir
          linhas.push(`<div style="display:flex;align-items:center;gap:12px;padding:6px 14px;background:#fafafa;border-radius:10px;margin-bottom:6px;border-left:4px solid ${statusColor};opacity:0.55;">
            <div style="font-size:11px;font-weight:600;color:var(--muted);width:44px;flex-shrink:0;">${horaLabel}</div>
            <div style="font-size:11px;color:var(--muted);">↳ em atendimento</div>
          </div>`);
        }
      }else{
        linhas.push(`<div style="display:flex;align-items:center;gap:12px;padding:10px 14px;background:transparent;border:1.5px dashed var(--border);border-radius:10px;margin-bottom:6px;">
          <div style="font-size:12px;font-weight:700;color:var(--muted);width:44px;flex-shrink:0;">${horaLabel}</div>
          <div style="font-size:12px;color:#bbb;">✅ Livre</div>
        </div>`);
      }
      cursor+=30;
    }

    const totalOcupados=ags.length;
    const legenda=`
      <div style="display:flex;gap:14px;margin-bottom:14px;font-size:11px;color:var(--muted);flex-wrap:wrap;">
        <span>🟡 Pendente</span><span>🟢 Confirmado</span><span>⬜ Livre</span><span>🍽️ Almoço</span>
      </div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:10px;">${totalOcupados} agendamento(s) neste dia</div>`;

    return header+legenda+linhas.join('');
  },

  mudarDiaAgenda(delta){
    const d=new Date(this.agendaDiaData+'T12:00:00');
    d.setDate(d.getDate()+delta);
    this.agendaDiaData=d.toISOString().split('T')[0];
    document.getElementById('painel-content').innerHTML=this.renderAgenda();
  },

  mudarProfAgenda(profId){
    this.agendaDiaProf=profId;
    document.getElementById('painel-content').innerHTML=this.renderAgenda();
  },

  async updateAg(id,status){
    await DB.updateStatus(id,status);
    await this.refreshPainelContent();
    document.getElementById('painel-content').innerHTML=this.renderAgenda();
    this.showToast(status==='confirmado'?'✅ Confirmado!':(status==='cancelado'?'❌ Cancelado':''));
  },

  async bloquearClienteDeAg(agId){
    const ag=this.cache.agendamentos.find(a=>a.id===agId);
    if(!ag){this.showToast('⚠️ Agendamento não encontrado');return}
    const jaExiste=this.cache.bloqueios.some(c=>(ag.clienteId&&c.clienteId===ag.clienteId)||(ag.clienteTel&&c.tel===ag.clienteTel));
    if(jaExiste){this.showToast('⚠️ Cliente já está bloqueado');return}
    await DB.bloquearCliente(this.cache.negocioId,ag.clienteId,ag.clienteNome||'Desconhecido',ag.clienteTel||'',ag.clienteEmail||'');
    await DB.updateStatus(agId,'cancelado');
    await this.refreshPainelContent();
    document.getElementById('painel-content').innerHTML=this.renderAgenda();
    this.showToast('🚫 Cliente bloqueado!');

  filtrarHistorico(){
    const nome=(document.getElementById('h-nome')||{value:''}).value.trim().toLowerCase();
    const de=(document.getElementById('h-de')||{value:''}).value;
    const ate=(document.getElementById('h-ate')||{value:''}).value;
    document.getElementById('historico-result').innerHTML=this.renderHistoricoResult(nome,de,ate);

  renderHistoricoResult(nome,de,ate){
    const servicos=this.cache.servicos;
    const profs=this.cache.profissionais;
    let ags=[...this.cache.agendamentos].sort((a,b)=>(b.data+b.hora).localeCompare(a.data+a.hora));
    if(nome)ags=ags.filter(a=>(a.clienteNome||'').toLowerCase().includes(nome));
    if(de)ags=ags.filter(a=>a.data>=de);
    if(ate)ags=ags.filter(a=>a.data<=ate);
    if(!ags.length)return`<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-text">Nenhum agendamento encontrado</div></div>`;
    return ags.map(ag=>{
      const s=servicos.find(x=>x.id===ag.servicoId);
      const p=profs.find(x=>x.id===ag.profissionalId);
      const df=new Date(ag.data+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
      const jaBloqueado=this.cache.bloqueios.some(c=>(ag.clienteId&&c.clienteId===ag.clienteId)||(ag.clienteTel&&c.tel===ag.clienteTel));
      return`<div class="ag-card ${ag.status}">
        <div class="ag-head"><div class="ag-nome">${esc(ag.clienteNome)}</div><div class="ag-status ${ag.status}">${ag.status}</div></div>
        <div class="ag-info">
          <span>📱 ${esc(ag.clienteTel)||'-'}</span>
          ${ag.clienteEmail?`<span>✉️ ${esc(ag.clienteEmail)}</span>`:''}
          <span>✂️ ${s?s.nome:'-'} · R$${s?s.preco:'-'}</span>
          <span>👤 ${p?p.nome:'-'}</span>
          <span>📅 ${df} às ${ag.hora}</span>
        </div>
        ${!jaBloqueado?`
        <div class="ag-actions">
          <button class="btn-sm" style="background:transparent;border:1px solid #aaa;color:#888;" onclick="App.bloquearClienteDeAg('${ag.id}')">🚫 Bloquear cliente</button>
        </div>`:`<div style="font-size:11px;color:var(--red);padding-top:4px;">🚫 Cliente já bloqueado</div>`}
      </div>`;
    }).join('');
  },

    const email=document.getElementById('bl-email').value.trim();
    const errEl=document.getElementById('bl-erro');

    const cliente=await DB.buscarClientePorEmail(email);
    if(!cliente){errEl.textContent='Nenhum cliente encontrado com este e-mail.';return}
    if(this.cache.bloqueios.some(c=>c.clienteId===cliente.id||c.email===email)){errEl.textContent='Este cliente já está bloqueado.';return}
    const result=await DB.bloquearCliente(this.cache.negocioId,cliente.id,cliente.nome,cliente.tel,cliente.email);
    if(result.error){errEl.textContent='Erro ao bloquear: '+result.error;return}
    await this.refreshPainelContent();
    document.getElementById('painel-content').innerHTML=this.renderBloqueados();
    this.showToast('🚫 Cliente bloqueado!');

    await this.refreshPainelContent();
    document.getElementById('painel-content').innerHTML=this.renderBloqueados();

  // ---- HORÁRIOS ----
  renderHorarios(){
    const profs=this.cache.profissionais;
    if(!profs.length)return`<div class="empty-state"><div class="empty-icon">👤</div><div class="empty-text">Cadastre um profissional primeiro na aba Equipe</div></div>`;
    if(!this.horariosProfId||!profs.some(p=>p.id===this.horariosProfId))this.horariosProfId=profs[0].id;
    const profId=this.horariosProfId;

    const defaults=HORARIO_PADRAO;
    const h=this.cache.horarios[profId]||defaults;
    const dias=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
    const rows=dias.map((d,i)=>{
      const dia=h[i]||defaults[i];
      const almoco=dia.almoco||{on:false,inicio:'12:00',fim:'13:00'};
      return`
      <div class="day-row" style="flex-direction:column;align-items:stretch;gap:10px;">
        <div class="day-header-row">
          <label class="day-toggle"><input type="checkbox" id="day-${i}" ${dia.on?'checked':''} onchange="App.toggleDia(${i})"><span class="day-slider"></span></label>
          <span class="day-name">${d}</span>
          <div class="day-times" id="day-times-${i}" style="${dia.on?'':'opacity:.3;pointer-events:none'}">
            <input class="time-input" type="time" id="day-ini-${i}" value="${dia.inicio}" onchange="App.salvarHorarios()">
            <span class="time-sep">até</span>
            <input class="time-input" type="time" id="day-fim-${i}" value="${dia.fim}" onchange="App.salvarHorarios()">
          </div>
        </div>
        <div id="almoco-wrap-${i}" class="day-header-row" style="display:${dia.on?'flex':'none'};padding-left:0;">
          <label class="day-toggle day-toggle-sm">
            <input type="checkbox" id="almoco-on-${i}" ${almoco.on?'checked':''} onchange="App.toggleAlmoco(${i})">
            <span class="day-slider"></span>
          </label>
          <span style="font-size:12px;color:var(--muted);flex-shrink:0;">🍽️ Almoço</span>
          <div class="day-times" id="almoco-times-${i}" style="${almoco.on?'':'opacity:.3;pointer-events:none'}">
            <input class="time-input" type="time" id="almoco-ini-${i}" value="${almoco.inicio}" onchange="App.salvarHorarios()">
            <span class="time-sep">até</span>
            <input class="time-input" type="time" id="almoco-fim-${i}" value="${almoco.fim}" onchange="App.salvarHorarios()">
          </div>
        </div>
      </div>`;
    }).join('');

    const bloqueados=h.bloqueados||[];
    const bloqueiasHtml=bloqueados.length?bloqueados.map((d,i)=>`
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--white);border-radius:10px;margin-bottom:8px;box-shadow:var(--shadow);">
        <span style="font-size:13px;font-weight:600;">📵 ${new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</span>
        <button class="btn-danger" onclick="App.desbloquearData(${i})">Remover</button>
      </div>`).join(''):'<div style="font-size:13px;color:var(--muted);padding:8px 0;">Nenhuma data bloqueada</div>';

    return`
      <div style="background:var(--white);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:16px;">
        <label class="form-label" style="margin-bottom:8px;">👤 Configurando horário de:</label>
        <select onchange="App.mudarProfHorario(this.value)" style="width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;background:var(--bg);color:var(--dark);">
          ${profs.map(p=>`<option value="${p.id}" ${p.id===profId?'selected':''}>${esc(p.nome)}</option>`).join('')}
        </select>
      </div>
      <div class="add-form">
        <div class="add-form-title">📅 Dias, horários e almoço</div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:14px;">Cada profissional pode ter dias e horários diferentes. Ative o dia, defina o expediente e o horário de almoço, se houver.</div>
        ${rows}
        <button class="btn-primary" style="margin-top:8px;" onclick="App.salvarHorarios()">💾 Salvar horários</button>
      </div>
      <div class="add-form">
        <div class="add-form-title">📵 Bloquear data específica</div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:12px;">Use para folgas, férias ou imprevistos deste profissional</div>
        <div class="form-group"><input class="form-input no-icon" type="date" id="bloquear-data" min="${new Date().toISOString().split('T')[0]}"></div>
        <button class="btn-primary" onclick="App.bloquearData()">Bloquear esta data</button>
        <div class="section-divider"></div>
        <div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;">Datas bloqueadas</div>
        ${bloqueiasHtml}
      </div>`;
  },

  mudarProfHorario(profId){
    this.horariosProfId=profId;
    document.getElementById('painel-content').innerHTML=this.renderHorarios();
  },

  toggleDia(i){
    const checked=document.getElementById('day-'+i).checked;
    const times=document.getElementById('day-times-'+i);
    times.style.opacity=checked?'1':'0.3';
    times.style.pointerEvents=checked?'auto':'none';
    document.getElementById('almoco-wrap-'+i).style.display=checked?'flex':'none';
    this.salvarHorarios();
  },

  toggleAlmoco(i){
    const checked=document.getElementById('almoco-on-'+i).checked;
    const times=document.getElementById('almoco-times-'+i);
    times.style.opacity=checked?'1':'0.3';
    times.style.pointerEvents=checked?'auto':'none';
    this.salvarHorarios();
  },

  async salvarHorarios(){
    const profId=this.horariosProfId;
    const current=this.cache.horarios[profId]||{bloqueados:[]};
    const bloqueados=current.bloqueados||[];
    const h={bloqueados};
    for(let i=0;i<7;i++){
      h[i]={
        on:document.getElementById('day-'+i)?document.getElementById('day-'+i).checked:(current[i]?current[i].on:false),
        inicio:document.getElementById('day-ini-'+i)?document.getElementById('day-ini-'+i).value:(current[i]?current[i].inicio:'08:00'),
        fim:document.getElementById('day-fim-'+i)?document.getElementById('day-fim-'+i).value:(current[i]?current[i].fim:'18:00'),
        almoco:{
          on:document.getElementById('almoco-on-'+i)?document.getElementById('almoco-on-'+i).checked:(current[i]&&current[i].almoco?current[i].almoco.on:false),
          inicio:document.getElementById('almoco-ini-'+i)?document.getElementById('almoco-ini-'+i).value:(current[i]&&current[i].almoco?current[i].almoco.inicio:'12:00'),
          fim:document.getElementById('almoco-fim-'+i)?document.getElementById('almoco-fim-'+i).value:(current[i]&&current[i].almoco?current[i].almoco.fim:'13:00'),
        }
      };
    }
    this.cache.horarios[profId]=h;
    await DB.saveHorarios(this.cache.negocioId,profId,h);
    this.showToast('✅ Horários salvos!');
  },

  async bloquearData(){
    const data=document.getElementById('bloquear-data').value;
    if(!data){this.showToast('⚠️ Selecione uma data');return}
    const profId=this.horariosProfId;
    const h=this.cache.horarios[profId]||{bloqueados:[]};
    if(!h.bloqueados)h.bloqueados=[];
    if(h.bloqueados.includes(data)){this.showToast('⚠️ Data já bloqueada');return}
    h.bloqueados.push(data);
    await DB.saveHorarios(this.cache.negocioId,profId,h);
    this.cache.horarios[profId]=h;
    document.getElementById('painel-content').innerHTML=this.renderHorarios();
    this.showToast('📵 Data bloqueada!');
  },

  async desbloquearData(idx){
    const profId=this.horariosProfId;
    const h=this.cache.horarios[profId]||{bloqueados:[]};
    h.bloqueados.splice(idx,1);
    await DB.saveHorarios(this.cache.negocioId,profId,h);
    this.cache.horarios[profId]=h;
    document.getElementById('painel-content').innerHTML=this.renderHorarios();
    this.showToast('✅ Data desbloqueada');
  },

  // ---- ASSINATURA ----
  async renderAssinatura(){
    const negocio=this.cache.negocio;
    const assinatura=await DB.getAssinatura(negocio.id);
    const PLANOS={basico:{nome:'Básico',preco:'R$30/mês'},pro:{nome:'Pro',preco:'R$50/mês'}};

    if(!assinatura){
      return`<div class="empty-state"><div class="empty-icon">💳</div><div class="empty-text">Nenhuma informação de assinatura encontrada.</div></div>`;
    }

    const statusInfo={
      trial:{label:'🎁 Período de teste grátis',color:'var(--blue)',bg:'rgba(59,130,246,0.1)'},
      ativo:{label:'✅ Assinatura ativa',color:'var(--green)',bg:'rgba(16,185,129,0.1)'},
      cancelamento_agendado:{label:'⏳ Cancelamento agendado',color:'var(--gold)',bg:'rgba(212,175,55,0.1)'},
      atrasado:{label:'⚠️ Pagamento atrasado',color:'var(--red)',bg:'rgba(239,68,68,0.1)'},
      cancelado:{label:'❌ Assinatura cancelada',color:'var(--muted)',bg:'var(--gray)'},
    }[assinatura.status]||{label:assinatura.status,color:'var(--muted)',bg:'var(--gray)'};

    const planoInfo=assinatura.plano?PLANOS[assinatura.plano]:null;
    const dataFmt=assinatura.proximoVencimento?new Date(assinatura.proximoVencimento+'T12:00:00').toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'}):'-';

    let acaoHtml='';
    if(assinatura.status==='ativo'&&assinatura.temAssinaturaStripe){
      acaoHtml=`
        <button class="btn-sm" style="width:100%;padding:12px;background:transparent;border:2px solid var(--red);color:var(--red);border-radius:12px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;" onclick="App.cancelarMinhaAssinatura('${negocio.id}',this)">
          Cancelar assinatura
        </button>
        <div style="font-size:11px;color:var(--muted);text-align:center;margin-top:8px;">Você continua com acesso total até ${dataFmt}</div>`;
    }else if(assinatura.status==='cancelamento_agendado'){
      acaoHtml=`
        <div style="background:#fef3c7;border:1px solid #fde68a;border-radius:12px;padding:14px;font-size:12px;color:#92400e;margin-bottom:12px;">
          Sua assinatura foi cancelada e continuará ativa até <strong>${dataFmt}</strong>. Depois disso, o acesso será bloqueado.
        </div>
        <button class="btn-primary" onclick="App.reativarMinhaAssinatura('${negocio.id}',this)">↩️ Reativar assinatura</button>`;
    }else if(assinatura.status==='trial'||assinatura.status==='atrasado'||assinatura.status==='cancelado'){
      acaoHtml=`<button class="btn-primary" onclick="App.irParaPaywall('${negocio.id}')">Ver planos disponíveis</button>`;
    }

    // troca de plano — só faz sentido com assinatura paga e ativa
    let trocaPlanoHtml='';
    if(assinatura.status==='ativo'&&assinatura.temAssinaturaStripe&&assinatura.plano){
      if(assinatura.plano==='basico'){
        trocaPlanoHtml=`
        <div class="add-form">
          <div class="add-form-title">⬆️ Fazer upgrade para o Pro</div>
          <div style="font-size:12px;color:var(--muted);margin-bottom:14px;">Passa a valer na hora. Você paga só a diferença proporcional aos dias restantes deste mês — sem cobrar o valor cheio de novo.</div>
          <button class="btn-primary" onclick="App.trocarMeuPlano('${negocio.id}','pro',this)">Fazer upgrade para Pro — R$50/mês</button>
        </div>`;
      }else if(assinatura.plano==='pro'){
        trocaPlanoHtml=`
        <div class="add-form">
          <div class="add-form-title">⬇️ Mudar para o Básico</div>
          <div style="font-size:12px;color:var(--muted);margin-bottom:14px;">Você continua com os recursos Pro até <strong>${dataFmt}</strong> (já pago). A partir daí, passa a cobrar R$30/mês automaticamente — sem estorno, sem cobrança dobrada.</div>
          <button style="width:100%;padding:12px;background:transparent;border:2px solid var(--border);border-radius:12px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;" onclick="App.trocarMeuPlano('${negocio.id}','basico',this)">Mudar para Básico — R$30/mês</button>
        </div>`;
      }
    }

    return`
      <div class="add-form">
        <div class="add-form-title">💳 Sua assinatura</div>
        <div style="background:${statusInfo.bg};border-radius:12px;padding:14px;margin-bottom:16px;">
          <div style="font-size:13px;font-weight:700;color:${statusInfo.color};">${statusInfo.label}</div>
        </div>
        <div class="summary-row" style="border-bottom:1px solid var(--border);"><span class="summary-lbl" style="color:var(--muted);">Plano</span><span style="font-weight:600;">${planoInfo?planoInfo.nome+' — '+planoInfo.preco:'Nenhum (teste grátis)'}</span></div>
        <div class="summary-row" style="border-bottom:none;"><span class="summary-lbl" style="color:var(--muted);">${assinatura.status==='cancelamento_agendado'?'Acesso até':'Próxima cobrança'}</span><span style="font-weight:600;">${dataFmt}</span></div>
      </div>
      ${trocaPlanoHtml}
      <div class="add-form">
        ${acaoHtml}
      </div>`;
  },

  async trocarMeuPlano(negocioId,novoPlano,btnEl){
    const mensagem=novoPlano==='pro'
      ?'Fazer upgrade para o Pro agora? Você vai pagar a diferença proporcional aos dias restantes deste mês e já terá acesso ao Pro imediatamente.'
      :'Mudar para o Básico? Você continua com os recursos Pro até o fim do período já pago — a mudança só passa a valer na próxima cobrança, sem estorno.';
    if(!confirm(mensagem))return;
    const textoOriginal=btnEl.textContent;
    btnEl.textContent='Processando...';btnEl.disabled=true;
    const result=await DB.trocarPlano(negocioId,novoPlano);
    if(result.error){this.showToast('⚠️ '+result.error);btnEl.textContent=textoOriginal;btnEl.disabled=false;return}
    if(result.tipo==='upgrade'){
      this.showToast('✅ Upgrade feito! Você já tem acesso ao Pro.');
    }else{
      this.showToast('✅ Mudança agendada! Vale a partir do fim do período atual.');
    }
    document.getElementById('painel-content').innerHTML=await this.renderAssinatura();
  },

  async irParaPaywall(negocioId){
    const dono=await DB.getDonoAtual();
    if(!dono){this.navigate('login');return}
    const assinatura=await DB.getAssinatura(negocioId);
    this.showPaywall(dono,assinatura);
  },

  async cancelarMinhaAssinatura(negocioId,btnEl){
    if(!confirm('Tem certeza que quer cancelar sua assinatura? Você continua com acesso até o fim do período já pago.'))return;
    btnEl.textContent='Cancelando...';btnEl.disabled=true;
    const result=await DB.cancelarAssinatura(negocioId,false);
    if(result.error){this.showToast('⚠️ '+result.error);btnEl.textContent='Cancelar assinatura';btnEl.disabled=false;return}
    this.showToast('✅ Assinatura cancelada. Acesso continua até o fim do período.');
    document.getElementById('painel-content').innerHTML=await this.renderAssinatura();
  },

  async reativarMinhaAssinatura(negocioId,btnEl){
    btnEl.textContent='Reativando...';btnEl.disabled=true;
    const result=await DB.cancelarAssinatura(negocioId,true);
    if(result.error){this.showToast('⚠️ '+result.error);btnEl.textContent='↩️ Reativar assinatura';btnEl.disabled=false;return}
    this.showToast('✅ Assinatura reativada!');
    document.getElementById('painel-content').innerHTML=await this.renderAssinatura();
  },

  async salvarNome(){
    const nome=document.getElementById('cfg-nome').value.trim();
    if(!nome){this.showToast('⚠️ Digite o nome');return}
    await DB.updateNegocio(this.cache.negocioId,{nome});
    this.cache.negocio.nome=nome;
    document.querySelector('.painel-title').textContent=nome;
    this.showToast('✅ Nome atualizado!');
  },

  async uploadLogo(e){
    const file=e.target.files[0];if(!file)return;
    if(!arquivoValido(file,(m)=>this.showToast(m))){e.target.value='';return}
    const reader=new FileReader();
    reader.onload=async ev=>{
      await DB.updateNegocio(this.cache.negocioId,{logo:ev.target.result});
      this.cache.negocio.logo=ev.target.result;
      const dono=await DB.getDonoAtual();
      await this.showPainel(dono);
      setTimeout(()=>{const configTab=document.querySelector('.tab[data-tab="config"]');this.switchTab('config',configTab)},100);
      this.showToast('✅ Logo atualizado!');
    };
    reader.readAsDataURL(file);
  },

  async uploadCapa(e){
    const file=e.target.files[0];if(!file)return;
    if(!arquivoValido(file,(m)=>this.showToast(m))){e.target.value='';return}
    const reader=new FileReader();
    reader.onload=async ev=>{
      await DB.updateNegocio(this.cache.negocioId,{capa:ev.target.result});
      this.cache.negocio.capa=ev.target.result;
      const dono=await DB.getDonoAtual();
      await this.showPainel(dono);
      setTimeout(()=>{const configTab=document.querySelector('.tab[data-tab="config"]');this.switchTab('config',configTab)},100);
      this.showToast('✅ Capa atualizada!');
    };
    reader.readAsDataURL(file);
  },

  copyLink(slug){const url=`${location.origin}${location.pathname}#agendar/${slug}`;navigator.clipboard.writeText(url).then(()=>this.showToast('🔗 Link copiado!'))},

    if(result.error){errEl.textContent=result.error;errEl.style.display='block';return}
    await this.showAgendarPage(slug);

  async renderMeusAgendamentosLista(ags,todayStr){

    const negocioIds=[...new Set(ags.map(a=>a.negocioId))];
    const negociosMap={},servicosMap={},profsMap={};
    await Promise.all(negocioIds.map(async nid=>{
      const [neg,servs,profs]=await Promise.all([
        sb.from('negocios').select('*').eq('id',nid).maybeSingle(),
        DB.getServicos(nid),
        DB.getProfissionais(nid),
      ]);
      negociosMap[nid]=mapNegocio(neg.data);
      servicosMap[nid]=servs;
      profsMap[nid]=profs;
    }));

    return ags.map(ag=>{
      const negocio=negociosMap[ag.negocioId];
      const servicos=negocio?servicosMap[ag.negocioId]:[];
      const profs=negocio?profsMap[ag.negocioId]:[];
      const s=servicos.find(x=>x.id===ag.servicoId);
      const p=profs.find(x=>x.id===ag.profissionalId);
      const df=new Date(ag.data+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
      const isPast=ag.data<todayStr;
      const podeCancel=!isPast&&ag.status!=='cancelado';
      return`<div class="ag-card ${ag.status}">
        <div class="ag-head">
          <div class="ag-nome">🏪 ${negocio?negocio.nome:'Barbearia removida'}</div>
          <div class="ag-status ${ag.status}">${ag.status}</div>

          <span>✂️ ${s?s.nome:'-'} · R$${s?s.preco:'-'}</span>

          <span>📅 ${df} às ${ag.hora}</span>
          ${isPast?'<span style="color:#bbb;">🕓 Agendamento já passou</span>':''}
        </div>
        ${podeCancel?`
        <div class="ag-actions">
          <button class="btn-sm btn-cancel-ag" onclick="App.cancelarMeuAgendamento('${ag.id}')">✕ Cancelar agendamento</button>
