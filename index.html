  // ---- CALENDAR ----
  gerarSlots(inicio,fim,duracao,almoco){
    const slots=[];
    const [hI,mI]=inicio.split(':').map(Number);
    const [hF,mF]=fim.split(':').map(Number);
    let cur=hI*60+mI;
    const end=hF*60+mF;
    let almocoIni=null,almocoFim=null;
    if(almoco&&almoco.on){
      const [aI,amI]=almoco.inicio.split(':').map(Number);
      const [aF,amF]=almoco.fim.split(':').map(Number);
      almocoIni=aI*60+amI;almocoFim=aF*60+amF;
    }
    // sempre avança de 30 em 30 min, independente da duração do serviço —
    // assim um horário livre aparece pra qualquer serviço que caiba nele
    while(cur+duracao<=end){
      const slotFim=cur+duracao;
      const conflitaComAlmoco=almocoIni!==null&&(cur<almocoFim&&slotFim>almocoIni);
      if(!conflitaComAlmoco){
        slots.push(`${String(Math.floor(cur/60)).padStart(2,'0')}:${String(cur%60).padStart(2,'0')}`);
      }
      cur+=30;
    }
    return slots;
  },

  renderCalendar(){
    const wrap=document.getElementById('cal-wrap');if(!wrap)return;
    if(!this.selectedProfissional){
      wrap.innerHTML=`<div style="text-align:center;padding:24px 12px;color:var(--muted);font-size:13px;">👆 Escolha um profissional acima para ver os dias disponíveis</div>`;
      return;
    }
    const h=this.cache.horarios[this.selectedProfissional.id]||{0:{on:false},1:{on:true},2:{on:true},3:{on:true},4:{on:true},5:{on:true},6:{on:true},bloqueados:[]};
    const bloqueados=h.bloqueados||[];
    const now=new Date();
    const year=this.calYear,month=this.calMonth;
    const mNames=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    const firstDay=new Date(year,month,1).getDay();
    const daysInMonth=new Date(year,month+1,0).getDate();
    const todayStr=now.toISOString().split('T')[0];
    const labels=['D','S','T','Q','Q','S','S'];
    let days=labels.map(l=>`<div class="cal-daylbl">${l}</div>`).join('');
    for(let i=0;i<firstDay;i++)days+=`<div class="cal-day empty"></div>`;
    for(let d=1;d<=daysInMonth;d++){
      const ds=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const isPast=ds<todayStr;
      const dow=new Date(ds+'T12:00:00').getDay();
      const isBloqueado=bloqueados.includes(ds);
      const isDiaOff=!h[dow]||!h[dow].on;
      const disabled=isPast||isBloqueado||isDiaOff;
      const isSelected=ds===this.selectedData;
      const isToday=ds===todayStr;
      const cls=disabled?(isBloqueado?'blocked':'disabled'):isSelected?'selected':isToday?'today':'';
      days+=`<button class="cal-day ${cls}" ${disabled?'disabled':`onclick="App.selectData('${ds}')"`}>${d}</button>`;
    }
    wrap.innerHTML=`
      <div style="font-size:12px;color:var(--muted);margin-bottom:10px;">📅 Dias disponíveis de <strong style="color:var(--dark);">${this.selectedProfissional.nome}</strong></div>
      <div class="cal-head">
        <button class="cal-nav" onclick="App.prevMonth()">‹</button>
        <div class="cal-month">${mNames[month]} ${year}</div>
        <button class="cal-nav" onclick="App.nextMonth()">›</button>
      </div>
      <div class="cal-grid">${days}</div>`;
  },

  prevMonth(){
    if(this.calMonth===0){this.calMonth=11;this.calYear--}else this.calMonth--;
    const now=new Date();
    if(this.calYear<now.getFullYear()||(this.calYear===now.getFullYear()&&this.calMonth<now.getMonth())){this.calMonth=now.getMonth();this.calYear=now.getFullYear()}
    this.renderCalendar();
  },

  nextMonth(){
    if(this.calMonth===11){this.calMonth=0;this.calYear++}else this.calMonth++;
    this.renderCalendar();
  },

  selectData(ds){
    this.selectedData=ds;this.selectedHora=null;
    this.renderCalendar();
    const d=new Date(ds+'T12:00:00');
    document.getElementById('res-data').textContent=d.toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'short'});
    document.getElementById('res-hora').textContent='—';
    this.refreshHorarios();
  },

  async refreshHorarios(){
    if(!this.selectedData||!this.selectedProfissional)return;
    const section=document.getElementById('horarios-section');
    const grid=document.getElementById('time-grid');
    if(!section||!grid)return;
    section.style.display='block';
    grid.innerHTML='<div style="grid-column:span 4;font-size:13px;color:var(--muted);padding:8px;">Carregando horários...</div>';
    const h=this.cache.horarios[this.selectedProfissional.id]||{};
    const dow=new Date(this.selectedData+'T12:00:00').getDay();
    const dayConfig=h[dow]||{on:true,inicio:'08:00',fim:'18:00'};
    const duracao=this.selectedServico?this.selectedServico.duracao:30;
    const slots=this.gerarSlots(dayConfig.inicio,dayConfig.fim,duracao,dayConfig.almoco);
    const ocupados=await DB.getHorariosOcupados(this.currentNegocio.id,this.selectedProfissional.id,this.selectedData);
    grid.innerHTML=slots.map(hora=>{
      const [hh,mm]=hora.split(':').map(Number);
      const slotIni=hh*60+mm;
      const slotFim=slotIni+duracao;
      const busy=ocupados.some(o=>slotIni<o.fim&&slotFim>o.ini);
      const sel=hora===this.selectedHora;
      return`<div class="time-slot ${busy?'busy':sel?'selected':''}" ${!busy?`onclick="App.selectHora('${hora}')"`:''}>${hora}</div>`;
    }).join('');
    if(!slots.length)grid.innerHTML='<div style="grid-column:span 4;font-size:13px;color:var(--muted);padding:8px;">Sem horários disponíveis neste dia.</div>';
  },

  selectHora(hora){
    this.selectedHora=hora;this.refreshHorarios();
    document.getElementById('res-hora').textContent=hora;
  },

  gerarCodigo(){
    const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code='';for(let i=0;i<6;i++)code+=chars[Math.floor(Math.random()*chars.length)];
    return code;
  },

  async confirmarAgendamento(){
    const clienteSession=this.currentCliente;
    if(!clienteSession){this.showToast('⚠️ Faça login para agendar');return}
    if(!this.selectedServico){this.showToast('⚠️ Escolha um serviço');return}
    if(!this.selectedProfissional){this.showToast('⚠️ Escolha um profissional');return}
    if(!this.selectedData){this.showToast('⚠️ Escolha uma data');return}
    if(!this.selectedHora){this.showToast('⚠️ Escolha um horário');return}

    // checagem final de ocupação (evita conflito de dois clientes agendando ao mesmo tempo)
    const ocupadosFinal=await DB.getHorariosOcupados(this.currentNegocio.id,this.selectedProfissional.id,this.selectedData);
    const [selH,selM]=this.selectedHora.split(':').map(Number);
    const selIni=selH*60+selM;
    const selFim=selIni+this.selectedServico.duracao;
    const conflita=ocupadosFinal.some(o=>selIni<o.fim&&selFim>o.ini);
    if(conflita){
      this.showToast('⚠️ Esse horário acabou de ser reservado. Escolha outro.');
      this.refreshHorarios();
      return;
    }

    const codigo=this.gerarCodigo();
    const result=await DB.insertAgendamento({
      negocioId:this.currentNegocio.id,clienteId:clienteSession.id,clienteNome:clienteSession.nome,
      clienteTel:clienteSession.tel,clienteEmail:clienteSession.email,servicoId:this.selectedServico.id,
      profissionalId:this.selectedProfissional.id,data:this.selectedData,hora:this.selectedHora,codigo
    });
    if(result.error){this.showToast('⚠️ Erro ao agendar. Tente novamente.');return}

    const d=new Date(this.selectedData+'T12:00:00');
    const fmt=d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
    document.getElementById('success-card').innerHTML=`
      <div class="success-row"><span class="s-icon">👤</span><div><div class="s-lbl">Cliente</div><div class="s-val">${esc(clienteSession.nome)}</div></div></div>
      <div class="success-row"><span class="s-icon">✂️</span><div><div class="s-lbl">Serviço</div><div class="s-val">${this.selectedServico.nome}</div></div></div>
      <div class="success-row"><span class="s-icon">👤</span><div><div class="s-lbl">Profissional</div><div class="s-val">${this.selectedProfissional.nome}</div></div></div>
      <div class="success-row"><span class="s-icon">📅</span><div><div class="s-lbl">Data e hora</div><div class="s-val">${fmt} às ${this.selectedHora}</div></div></div>
      <div class="success-row"><span class="s-icon">💰</span><div><div class="s-lbl">Total</div><div class="s-val">R$${this.selectedServico.preco}</div></div></div>
      <div style="margin-top:16px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:14px;">
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#065f46;margin-bottom:6px;">🔑 Código de cancelamento</div>
        <div style="font-family:'Playfair Display',serif;font-size:28px;font-weight:900;color:#064e3b;letter-spacing:6px;text-align:center;padding:8px 0;">${codigo}</div>
        <div style="font-size:11px;color:#065f46;text-align:center;margin-top:4px;">Guarde este código para cancelar se precisar</div>
      </div>
      <button onclick="App.navigate('cancelar/${codigo}')" style="width:100%;margin-top:12px;padding:12px;background:transparent;border:2px solid var(--border);border-radius:12px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);">Precisa cancelar? Clique aqui</button>`;
    document.getElementById('success-wrap').classList.add('show');
  },

  // ============================================
  // TELA CANCELAMENTO (por código)
  // ============================================
  async showCancelarPage(codigo){
    document.getElementById('app').innerHTML=`<div class="app-wrap" style="min-height:100vh;display:flex;flex-direction:column;">
      <div style="background:var(--dark);padding:48px 24px 28px;text-align:center;">
        <div style="font-size:36px;margin-bottom:8px;">🗓️</div>
        <div style="font-family:'Playfair Display',serif;font-size:22px;font-weight:900;color:white;">Cancelar Agendamento</div>
      </div>
      <div style="padding:28px 24px;flex:1;" id="cancelar-body">
        <div class="loading">Carregando...</div>
      </div>
    </div>
    <div class="toast" id="toast"></div>`;

    const ag=codigo?await DB.buscarPorCodigo(codigo):null;
    document.getElementById('cancelar-body').innerHTML=await this.renderCancelarBody(ag,codigo);
  },

  async renderCancelarBody(ag,codigo){
    if(!ag){
      return`<div style="text-align:center;padding:40px 0;">
        <div style="font-size:48px;margin-bottom:16px;">🔍</div>
        <div style="font-family:'Playfair Display',serif;font-size:20px;font-weight:700;margin-bottom:8px;">Código não encontrado</div>
        <div style="font-size:13px;color:var(--muted);margin-bottom:24px;">Verifique o código e tente novamente.</div>
        <div style="margin-bottom:16px;">
          <input class="form-input no-icon" type="text" id="codigo-input" placeholder="Digite seu código (ex: AB3C9D)" style="text-align:center;font-size:18px;letter-spacing:4px;text-transform:uppercase;">
        </div>
        <button class="btn-primary" onclick="App.buscarCodigo()">Buscar agendamento</button>
      </div>`;
    }
    if(ag.status==='cancelado'){
      return`<div style="text-align:center;padding:40px 0;">
        <div style="font-size:48px;margin-bottom:16px;">❌</div>
        <div style="font-family:'Playfair Display',serif;font-size:20px;font-weight:700;margin-bottom:8px;">Já cancelado</div>
        <div style="font-size:13px;color:var(--muted);">Este agendamento já foi cancelado.</div>
      </div>`;
    }
    const negocioData=await sb.from('negocios').select('*').eq('id',ag.negocioId).maybeSingle();
    const negocioObj=mapNegocio(negocioData.data);
    const servicos=await DB.getServicos(ag.negocioId);
    const profs=await DB.getProfissionais(ag.negocioId);
    const s=servicos.find(x=>x.id===ag.servicoId);
    const p=profs.find(x=>x.id===ag.profissionalId);
    const d=new Date(ag.data+'T12:00:00');
    const fmt=d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
    const isPast=ag.data<new Date().toISOString().split('T')[0];
    return`
      <div style="background:var(--white);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:20px;">
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--gold);margin-bottom:14px;">📋 Detalhes do agendamento</div>
        <div class="success-row"><span class="s-icon">🏪</span><div><div class="s-lbl">Barbearia</div><div class="s-val">${negocioObj?esc(negocioObj.nome):'-'}</div></div></div>
        <div class="success-row"><span class="s-icon">✂️</span><div><div class="s-lbl">Serviço</div><div class="s-val">${s?s.nome:'-'}</div></div></div>
        <div class="success-row"><span class="s-icon">👤</span><div><div class="s-lbl">Profissional</div><div class="s-val">${p?p.nome:'-'}</div></div></div>
        <div class="success-row"><span class="s-icon">📅</span><div><div class="s-lbl">Data e hora</div><div class="s-val">${fmt} às ${ag.hora}</div></div></div>
        <div class="success-row"><span class="s-icon">🔖</span><div><div class="s-lbl">Status</div><div class="s-val" style="color:${ag.status==='confirmado'?'var(--green)':'#92400e'}">${ag.status==='confirmado'?'✅ Confirmado':'⏳ Pendente'}</div></div></div>
      </div>
      ${isPast
        ?`<div style="background:#fef3c7;border:1px solid #fde68a;border-radius:12px;padding:14px;text-align:center;font-size:13px;color:#92400e;">Este agendamento já passou e não pode ser cancelado.</div>`
        :`<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:16px;margin-bottom:16px;">
            <div style="font-size:13px;color:#991b1b;font-weight:600;margin-bottom:4px;">⚠️ Atenção</div>
            <div style="font-size:12px;color:#b91c1c;line-height:1.5;">Ao cancelar, o horário ficará disponível para outros clientes. Esta ação não pode ser desfeita.</div>
          </div>
          <button class="btn-primary" style="background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 4px 20px rgba(239,68,68,.3);" onclick="App.clienteCancelar('${codigo}')">❌ Cancelar meu agendamento</button>
          <button onclick="App.navigate('agendar/${negocioObj?negocioObj.slug:''}')" style="width:100%;margin-top:10px;padding:13px;background:transparent;border:2px solid var(--border);border-radius:12px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;">← Voltar</button>`
      }`;
  },

  buscarCodigo(){
    const codigo=document.getElementById('codigo-input').value.trim().toUpperCase();
    if(!codigo){this.showToast('⚠️ Digite o código');return}
    this.navigate('cancelar/'+codigo);
  },

  async clienteCancelar(codigo){
    await DB.cancelarPorCodigo(codigo);
    document.getElementById('cancelar-body').innerHTML=`
      <div style="text-align:center;padding:40px 0;">
        <div style="font-size:56px;margin-bottom:16px;">✅</div>
        <div style="font-family:'Playfair Display',serif;font-size:24px;font-weight:900;margin-bottom:10px;">Cancelado com sucesso</div>
        <div style="font-size:14px;color:var(--muted);line-height:1.6;">Seu agendamento foi cancelado.<br>O horário já está disponível para outros clientes.</div>
      </div>`;
    this.showToast('✅ Agendamento cancelado!');
  },

  resetAgendar(){
    this.selectedServico=null;this.selectedProfissional=null;this.selectedData=null;this.selectedHora=null;
    document.getElementById('success-wrap').classList.remove('show');
    document.querySelectorAll('.service-card').forEach(c=>c.classList.remove('selected'));
    document.querySelectorAll('.barber-card').forEach(c=>c.classList.remove('selected'));
    document.getElementById('res-servico').textContent='—';
    document.getElementById('res-prof').textContent='—';
    document.getElementById('res-data').textContent='—';
    document.getElementById('res-hora').textContent='—';
    document.getElementById('res-preco').textContent='—';
    document.getElementById('horarios-section').style.display='none';
    this.renderCalendar();
    window.scrollTo({top:0,behavior:'smooth'});
  },

  // ---- TOAST ----
  showToast(msg){
    const t=document.getElementById('toast');
    if(!t)return;
    t.textContent=msg;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2500);
  },
};

window.addEventListener('hashchange',()=>App.init());
window.addEventListener('DOMContentLoaded',async()=>{
  // Garante que o Supabase termine de processar qualquer token vindo de um
  // redirecionamento (ex: login com Google) antes do nosso roteador ler a URL
  await sb.auth.getSession();
  App.init();
});
document.addEventListener('click',(e)=>{
  const dd=document.getElementById('cliente-menu-dropdown');
  const btn=document.getElementById('cliente-menu-btn');
  if(dd&&dd.style.display==='block'&&!dd.contains(e.target)&&e.target!==btn&&!btn.contains(e.target)){
    dd.style.display='none';
  }
});
</script>
</body>
</html>
